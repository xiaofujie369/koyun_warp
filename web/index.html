<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koyun WARP Relay</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f38020'/><path d='M8 20c0-4 3-7 7-7 2.6 0 4.8 1.4 6 3.4A4 4 0 0 1 24 24H10a2 2 0 0 1-2-2v-2z' fill='white'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login hidden">
  <form class="login-card" id="loginForm">
    <div class="brand big"><span class="logo"></span><div><b>Koyun WARP Relay</b><small>Cloudflare WARP 转发控制台</small></div></div>
    <label>用户名<input name="username" autocomplete="username" required></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
    <p class="err" id="loginErr"></p>
    <button class="btn primary block" type="submit">登录</button>
  </form>
</div>

<div id="shell" class="shell hidden">
  <aside class="side" id="side">
    <div class="brand"><span class="logo"></span><div><b>Koyun WARP</b><small>Relay Console</small></div></div>
    <nav>
      <a href="#/dashboard" data-page="dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>概览</a>
      <a href="#/nodes" data-page="nodes"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>节点</a>
      <a href="#/tunnels" data-page="tunnels"><svg viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5H7z"/></svg>WARP 隧道</a>
      <a href="#/keys" data-page="keys"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3m-3 3 3 3m-6 0 2 2"/></svg>密钥池</a>
      <a href="#/rules" data-page="rules"><svg viewBox="0 0 24 24"><path d="M4 7h13l-3-3m6 13H7l3 3"/></svg>转发规则</a>
      <a href="#/cdn" data-page="cdn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>CDN 接入</a>
      <a href="#/monitor" data-page="monitor"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>监控</a>
      <a href="#/events" data-page="events"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>事件日志</a>
      <a href="#/settings" data-page="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>系统设置</a>
    </nav>
    <div class="side-foot">
      <span id="whoami"></span>
      <button class="btn ghost sm" id="logoutBtn">退出</button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="btn ghost sm menu" id="menuBtn" aria-label="菜单">☰</button>
      <h1 id="pageTitle">概览</h1>
      <div class="top-r">
        <span class="live" id="liveDot" title="实时刷新">LIVE</span>
        <button class="btn ghost sm" id="themeBtn" title="切换主题">◐</button>
      </div>
    </header>
    <main id="view"></main>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
